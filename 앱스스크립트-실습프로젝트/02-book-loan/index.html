<div class="wrap">

  <header>
    <h1>📚 학급 문고 대출 관리</h1>
    <p>2학년 △반 · 실명 대신 별칭을 씁니다</p>
  </header>

  <!-- 요약 -->
  <div class="stat-row">
    <div class="stat"><b id="statTotal">-</b><span>전체 도서</span></div>
    <div class="stat"><b id="statOut">-</b><span>대출 중</span></div>
  </div>

  <!-- 검색 -->
  <div class="card">
    <div class="search">
      <input type="text" id="keyword" placeholder="제목 또는 저자로 검색"
             onkeyup="if(event.key==='Enter') loadBooks()">
      <button class="ghost" onclick="loadBooks()">검색</button>
    </div>
    <p class="hint">검색어를 비우고 검색하면 전체 목록이 나옵니다.</p>
  </div>

    <h2>도서 목록</h2>
    <div id="bookList"><p class="empty">불러오는 중…</p></div>
    <div class="msg" id="listMsg"></div>
  </div>

  <!-- 새 책 등록 -->
  <div class="card">
    <h2>새 책 등록</h2>
    <div class="inline-form">
      <div class="field">
        <label for="newTitle">제목</label>
        <input type="text" id="newTitle" maxlength="60" placeholder="예: 페인트">

      <div class="field">
        <label for="newAuthor">저자</label>

      </div>
      <button class="primary" style="width:auto; padding:13px 20px" onclick="addBook()">등록</button>
    </div>
    <div class="msg" id="addMsg"></div>
  </div>

</div>
