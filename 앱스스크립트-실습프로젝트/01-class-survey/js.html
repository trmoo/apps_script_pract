<!--
  js.html  —  화면의 "동작"을 담당하는 파일
  ------------------------------------------------------------------
  이 코드는 서버가 아니라 사용자의 브라우저에서 실행된다.
  그래서 여기서는 SpreadsheetApp을 쓸 수 없다. (있지도 않다)
  시트에 무언가 하고 싶으면 google.script.run으로 Code.gs에 부탁한다.

      google.script.run
        .withSuccessHandler(성공했을 때 실행할 함수)
        .withFailureHandler(실패했을 때 실행할 함수)
        .서버함수이름(넘길 값);

  ⚠ 세 가지 규칙
   ① 비동기다. 위 코드 아래 줄이 서버 응답을 기다리지 않고 바로 실행된다.
      → 결과를 쓰는 코드는 반드시 withSuccessHandler 안에 넣는다.
   ② Date 객체·함수·DOM 요소는 넘길 수 없다. 숫자·문자·true/false·객체·배열만 된다.
      → 날짜는 문자열로 바꿔 넘기거나, 서버에서 new Date()를 만든다.
   ③ 이름 끝에 밑줄(_)이 붙은 서버 함수는 부를 수 없다.

  무단 배포·상업적 이용을 금합니다. 자세한 내용은 LICENSE 파일을 보세요.
-->
<script>
/* ────────────────────────────────────────────────────────────────
 * 1. 탭 전환
 * ──────────────────────────────────────────────────────────────*/
function showTab(which) {
  const isForm = (which === 'form');

  document.getElementById('panelForm').style.display   = isForm ? 'block' : 'none';
  document.getElementById('panelResult').style.display = isForm ? 'none'  : 'block';
  document.getElementById('tabForm').setAttribute('aria-selected', isForm);
  document.getElementById('tabResult').setAttribute('aria-selected', !isForm);

  // 결과 탭을 열 때마다 최신 데이터를 다시 불러온다.
  if (!isForm) loadStats();
}


/* ────────────────────────────────────────────────────────────────
 * 2. 제출하기
 * ──────────────────────────────────────────────────────────────*/
function handleSubmit(event) {
  event.preventDefault();          // 폼의 기본 동작(페이지 새로고침)을 막는다

  // ── 2-1. 화면에서 값 모으기
  const checked = document.querySelector('input[name="score"]:checked');
  if (!checked) {
    showMsg('만족도를 골라 주세요.', 'err');
    return;
  }

  const payload = {
    grade:   document.getElementById('grade').value,
    score:   Number(checked.value),          // 문자 "4" → 숫자 4 로 바꿔 보낸다
    menu:    document.getElementById('menu').value,
    comment: document.getElementById('comment').value
  };

  // ── 2-2. 두 번 눌리는 것을 막는다 (중복 제출 방지)
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.textContent = '저장하는 중…';

  // ── 2-3. 서버(Code.gs)의 saveResponse에 부탁한다
  google.script.run
      .withSuccessHandler(onSaved)
      .withFailureHandler(onError)
      .saveResponse(payload);
}

/** 서버가 { ok:true, total:n } 을 돌려주면 실행된다. */
function onSaved(result) {
  const btn = document.getElementById('submitBtn');
  btn.disabled = false;
  btn.textContent = '제출하기';

  showMsg('응답이 저장되었습니다. 고맙습니다! (지금까지 ' + result.total + '명)', 'ok');
  document.getElementById('surveyForm').reset();
}

/** 서버가 오류를 던지면 실행된다. error.message에 이유가 담겨 있다. */
function onError(error) {
  const btn = document.getElementById('submitBtn');
  btn.disabled = false;
  btn.textContent = '제출하기';

  showMsg('오류: ' + error.message, 'err');
}

/** 안내 메시지를 보여 준다. */
function showMsg(text, type) {
  const box = document.getElementById('formMsg');
  box.textContent = text;                       // textContent를 쓰면 태그가 실행되지 않는다
  box.className = 'msg show ' + type;
}


/* ────────────────────────────────────────────────────────────────
 * 3. 결과 불러오기
 * ──────────────────────────────────────────────────────────────*/
function loadStats() {
  google.script.run
      .withSuccessHandler(renderStats)
      .withFailureHandler(onError)
      .getStats();
}

function renderStats(s) {
  // ── 3-1. 요약 숫자
  document.getElementById('statTotal').textContent = s.total + '명';
  document.getElementById('statAvg').textContent   = s.total ? s.average + '점' : '-';

  if (s.total === 0) {
    document.getElementById('distBars').innerHTML    = '<p class="empty">아직 응답이 없습니다.</p>';
    document.getElementById('gradeBars').innerHTML   = '<p class="empty">아직 응답이 없습니다.</p>';
    document.getElementById('commentList').innerHTML = '<p class="empty">아직 의견이 없습니다.</p>';
    return;
  }

  // ── 3-2. 점수 분포 막대  (가장 많은 값을 100%로 잡는다)
  const maxCount = Math.max.apply(null, s.dist) || 1;
  let html = '';
  for (let i = 4; i >= 0; i--) {                        // 5점부터 위에서 아래로
    const percent = (s.dist[i] / maxCount) * 100;
    html += bar((i + 1) + '점', percent, s.dist[i] + '명');
  }
  document.getElementById('distBars').innerHTML = html;

  // ── 3-3. 학년별 평균  (5점 만점을 100%로 잡는다)
  html = '';
  Object.keys(s.byGrade).forEach(function (grade) {
    const avg = s.byGrade[grade];
    html += bar(grade, (avg / 5) * 100, avg + '점');
  });
  document.getElementById('gradeBars').innerHTML = html || '<p class="empty">-</p>';

  // ── 3-4. 최근 의견
  //   ⚠ 사용자가 쓴 글을 그대로 innerHTML에 넣으면 위험하다.
  //     누군가 <img src=x onerror=...> 같은 태그를 적어 두면 그게 실행될 수 있다(XSS).
  //     그래서 escapeHtml로 꺾쇠괄호를 무해한 글자로 바꾼 뒤 넣는다.
  //   ⚠ 그리고 이런 설명을 주석에 쓸 때도 조심해야 한다. 주석 안에 script 종료 태그를
  //     그대로 적으면 브라우저가 거기서 스크립트가 끝난 줄 알고 이 파일이 깨진다.
  html = s.comments.map(function (c) {
    return '<p class="quote">' + escapeHtml(c) + '</p>';
  }).join('');
  document.getElementById('commentList').innerHTML = html || '<p class="empty">아직 의견이 없습니다.</p>';
}

/** 막대 한 줄을 만드는 HTML 조각 */
function bar(name, percent, value) {
  return '<div class="bar-row">' +
           '<span class="name">' + escapeHtml(name) + '</span>' +
           '<span class="bar-track"><span class="bar-fill" style="width:' + percent + '%"></span></span>' +
           '<span class="val">' + escapeHtml(value) + '</span>' +
         '</div>';
}

/** < > & " 를 안전한 글자로 바꾼다. */
function escapeHtml(text) {
  return String(text)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
}


/* ────────────────────────────────────────────────────────────────
 * 4. 확장 미션
 *   ① 제출 직후 결과 탭으로 자동 이동하게 만들어 보자.  힌트: onSaved 안에서 showTab('result')
 *   ② 응답 수가 0일 때 결과 탭 자체를 숨겨 보자.
 *   ③ 막대 색을 점수에 따라 다르게 해 보자. (1~2점은 붉은색, 4~5점은 파란색)
 * ──────────────────────────────────────────────────────────────*/
</script>
