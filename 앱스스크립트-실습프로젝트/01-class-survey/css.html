<!--
  css.html  —  화면의 "보이는 모양"만 담당하는 파일
  ------------------------------------------------------------------
  앱스 스크립트에는 .css 파일을 만들 수 없다. 그래서 .html 파일 안에
  <style> 태그를 넣고, index.html의 include 줄로 불러온다.
  파일 이름이 css.html 이므로 include('css') 라고 쓴다. (확장자는 빼고 쓴다)
  이 파일은 템플릿으로 실행되지 않으므로 주석이 안전하지만, index.html은 다르다.
  ------------------------------------------------------------------
  © 2026 티쳐무 · 모든 권리 보유 — 학교 수업 목적으로만 이용해 주세요.
  무단 배포·상업적 이용을 금합니다. 자세한 내용은 LICENSE 파일을 보세요.
-->
<style>
  /* ── 1. 디자인 토큰: 색·간격을 이름으로 정해 두고 아래에서 재사용한다 ── */
  :root {
    --accent: #2f6df6;          /* 주제별로 이 한 줄만 바꾸면 색이 통째로 바뀐다 */
    --accent-weak: #eaf0ff;
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1c1f24;
    --muted: #6b7280;
    --line: #e3e6eb;
    --ok: #1f9254;
    --warn: #c2410c;
    --radius: 12px;
    --shadow: 0 1px 3px rgba(16,24,40,.08), 0 8px 24px rgba(16,24,40,.06);
  }

  /* ── 2. 기본 초기화 ── */
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 20px 16px 48px;
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 680px; margin: 0 auto; }

  /* ── 3. 머리말 ── */
  header h1 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.02em; }
  header p  { margin: 0 0 20px; color: var(--muted); font-size: 14px; }

  /* ── 4. 탭 ── */
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab {
    flex: 1; padding: 10px 12px; border: 1px solid var(--line);
    background: var(--card); border-radius: 999px; cursor: pointer;
    font-size: 14px; font-weight: 600; color: var(--muted);
  }
  .tab[aria-selected="true"] {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }

  /* ── 5. 카드 ── */
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; margin-bottom: 14px;
    box-shadow: var(--shadow);
  }
  .card h2 { font-size: 16px; margin: 0 0 12px; }

  /* ── 6. 폼 ── */
  .field { margin-bottom: 16px; }
  label { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .hint { font-size: 12px; color: var(--muted); font-weight: 400; margin-top: 4px; }
  input[type="text"], textarea, select {
    width: 100%; padding: 10px 12px; font-size: 15px; font-family: inherit;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--text);
  }
  input:focus, textarea:focus, select:focus {
    outline: 2px solid var(--accent-weak); border-color: var(--accent);
  }
  textarea { min-height: 84px; resize: vertical; }

  /* 별점(라디오 버튼을 버튼처럼 보이게 만든 것) */
  .scale { display: flex; gap: 6px; }
  .scale input { position: absolute; opacity: 0; width: 0; height: 0; }
  .scale label {
    flex: 1; text-align: center; padding: 12px 0; margin: 0; cursor: pointer;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; font-weight: 600;
  }
  .scale input:checked + label {
    background: var(--accent); border-color: var(--accent); color: #fff;
  }

  /* ── 7. 버튼 ── */
  button.primary {
    width: 100%; padding: 13px; font-size: 15px; font-weight: 700; font-family: inherit;
    background: var(--accent); color: #fff; border: 0; border-radius: 10px; cursor: pointer;
  }
  button.primary:disabled { opacity: .55; cursor: progress; }
  button.ghost {
    padding: 8px 14px; font-size: 13px; font-weight: 600; font-family: inherit;
    background: #fff; color: var(--accent); border: 1px solid var(--line);
    border-radius: 8px; cursor: pointer;
  }

  /* ── 8. 안내 메시지 ── */
  .notice {
    font-size: 13px; background: var(--accent-weak); border: 1px solid #d6e0ff;
    border-radius: 10px; padding: 12px 14px; margin-bottom: 16px; color: #24336b;
  }
  .notice ul { margin: 8px 0 0; padding-left: 18px; }
  .msg { font-size: 14px; padding: 12px 14px; border-radius: 10px; margin-top: 12px; display: none; }
  .msg.show { display: block; }
  .msg.ok   { background: #e8f7ee; color: var(--ok);   border: 1px solid #bfe6cf; }
  .msg.err  { background: #fdeeea; color: var(--warn); border: 1px solid #f6cdbf; }

  /* ── 9. 통계 화면 ── */
  .stat-row { display: flex; gap: 10px; margin-bottom: 16px; }
  .stat {
    flex: 1; background: var(--accent-weak); border-radius: 10px;
    padding: 14px 12px; text-align: center;
  }
  .stat b { display: block; font-size: 24px; letter-spacing: -.02em; }
  .stat span { font-size: 12px; color: var(--muted); }
  .bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; font-size: 13px; }
  .bar-row .name { width: 62px; flex: none; color: var(--muted); }
  .bar-track { flex: 1; height: 20px; background: #eef1f5; border-radius: 999px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s ease; }
  .bar-row .val { width: 42px; flex: none; text-align: right; font-weight: 700; }
  .quote { font-size: 14px; border-left: 3px solid var(--accent); padding: 4px 0 4px 12px; margin: 0 0 10px; color: #333; }
  .empty { color: var(--muted); font-size: 14px; text-align: center; padding: 20px 0; }

  /* ── 10. 좁은 화면 대응 ── */
  @media (max-width: 420px) {
    header h1 { font-size: 19px; }
    .stat b { font-size: 20px; }
    .scale label { padding: 10px 0; font-size: 14px; }
  }

  /* 화면 아래 저작권 표시 */
  .copy { max-width: 720px; margin: 0 auto; padding: 16px 16px 28px;
          color: var(--muted); font-size: 12px; text-align: center; }
</style>
